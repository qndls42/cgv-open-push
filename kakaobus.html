<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>210번 버스</title>
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2720%27 fill=%27%23f7e600%27/%3E%3Ctext x=%2750%27 y=%2766%27 font-size=%2744%27 text-anchor=%27middle%27 font-family=%27sans-serif%27 font-weight=%27bold%27%3E210%3C/text%3E%3C/svg%3E">
<style>body{font-family:sans-serif;padding:24px;text-align:center}a{display:block;margin:12px auto;max-width:320px;padding:16px 18px;font-size:18px;border:1px solid #999;border-radius:8px;text-decoration:none;color:#000}</style>
</head>
<body>
<p id="msg">카카오맵 앱을 여는 중입니다…<br><small>자동으로 안 열리면 아래 버튼을 누르세요.</small></p>
<p>
  <a id="app" href="#">카카오맵 앱에서 열기</a>
  <a id="web" href="#">웹으로 보기</a>
  <a id="store" href="#">앱 설치</a>
</p>
<script>
(function () {
  // 사용법: kakaobus.html?id=B9123   (id 없으면 B9123 = 210번)
  var id    = new URLSearchParams(location.search).get('id') || 'B9123';
  var query = 'id=' + encodeURIComponent(id) + '&type=busline';
  var scheme = 'kakaomap://transitInfo?' + query;                       // 앱이 노선 화면으로 열리는 스킴
  var web    = 'https://m.map.kakao.com/actions/busDetailInfo?busId=' + encodeURIComponent(id);
  var ua = navigator.userAgent;
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua);
  var store = isIOS ? 'https://apps.apple.com/kr/app/id304608425'
                    : 'https://play.google.com/store/apps/details?id=net.daum.android.map';
  // 안드로이드: intent 형식으로 카카오맵 패키지를 지정. 미설치면 S.browser_fallback_url로 이동.
  var intentUrl = 'intent://transitInfo?' + query
                + '#Intent;scheme=kakaomap;package=net.daum.android.map;S.browser_fallback_url='
                + encodeURIComponent(store) + ';end';
  var target = isAndroid ? intentUrl : scheme;

  document.getElementById('app').href   = target;
  document.getElementById('web').href   = web;
  document.getElementById('store').href = store;

  // 자동 실행. iOS는 스킴 실행 후 앱이 안 뜨면(페이지가 계속 보이면) 1.2초 뒤 스토어로.
  if (isAndroid) {
    location.replace(intentUrl);
  } else {
    var t = setTimeout(function () { if (!document.hidden) location.replace(store); }, 1200);
    document.addEventListener('visibilitychange', function () { if (document.hidden) clearTimeout(t); });
    location.href = scheme;
  }
})();
</script>
</body>
</html>
